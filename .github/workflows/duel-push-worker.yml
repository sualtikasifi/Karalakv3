name: Deploy duel push worker

# The duel push job (a friend challenged you / played your duel) runs on a free Cloudflare Worker cron every 5 minutes, because
# GitHub's own cron is delayed by hours. See cizim-hafiza/worker/duel-push. Needs the repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID; the Firebase service account is the one league-scheduler.yml already uses.
on:
  push:
    branches: [main]
    paths: ["cizim-hafiza/worker/duel-push/**", ".github/workflows/duel-push-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cizim-hafiza/worker/duel-push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test
        run: npm test
      - name: Deploy
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Firebase service account secret
        run: printf '%s' "$SA" | npx --yes wrangler@4 secret put FIREBASE_SERVICE_ACCOUNT
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
