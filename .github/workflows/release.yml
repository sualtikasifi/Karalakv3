name: Release bundle

# Manual only. Builds the signed Play Store bundle (.aab) with the real AdMob
# IDs, bumping versionCode/versionName first, and REFUSES to build if any
# ingredient is missing (a release without the real ad IDs shows no ads and
# earns nothing — see the guard at the bottom of app/build.gradle.kts).
#
# After a successful build the bumped app/build.gradle.kts is committed back
# to the branch the workflow was run on, so the next run continues from the
# new number (Play never accepts the same versionCode twice).
#
# Repository secrets to create once (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64   base64 of the .jks   (base64 -w0 karalak-release.jks)
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
#   ADMOB_APP_ID, ADMOB_INTERSTITIAL_UNIT_ID, ADMOB_REWARDED_UNIT_ID
#   DEVELOPER_ACCESS_CODE, REPORTS_ACCESS_CODE   (optional; blank locks those screens)
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (e.g. 1.25.0). Empty keeps the current one."
        required: false
      bump_version_code:
        description: "Increase versionCode by 1"
        type: boolean
        default: true

# contents: write is needed only to push the version bump back.
permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cizim-hafiza
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check secrets are present
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ADS1: ${{ secrets.ADMOB_APP_ID }}
          ADS2: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
          ADS3: ${{ secrets.ADMOB_REWARDED_UNIT_ID }}
        run: |
          for v in KS ADS1 ADS2 ADS3; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret behind $v"; exit 1; fi
          done

      - name: Bump version
        env:
          BUMP: ${{ inputs.bump_version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          F=app/build.gradle.kts
          if [ "$BUMP" = "true" ]; then
            CUR=$(grep -oP 'versionCode = \K[0-9]+' $F)
            sed -i "s/versionCode = $CUR/versionCode = $((CUR + 1))/" $F
          fi
          if [ -n "$VERSION_NAME" ]; then
            if ! printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}([-.][0-9A-Za-z]+)?$'; then
              echo "::error::version_name must look like 1.25.0"; exit 1
            fi
            sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" $F
          fi
          grep -E "versionCode|versionName" $F | head -2

      - name: Write signing key and local.properties
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
            echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}"
            echo "ADMOB_INTERSTITIAL_UNIT_ID=${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}"
            echo "ADMOB_REWARDED_UNIT_ID=${{ secrets.ADMOB_REWARDED_UNIT_ID }}"
            echo "DEVELOPER_ACCESS_CODE=${{ secrets.DEVELOPER_ACCESS_CODE }}"
            echo "REPORTS_ACCESS_CODE=${{ secrets.REPORTS_ACCESS_CODE }}"
          } > local.properties

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build release bundle (refuses without real ad IDs)
        run: ./gradlew :app:bundleRelease -PrequireRealAds --console=plain

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: karalak-release-aab
          path: cizim-hafiza/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # Only after the bundle exists, so a failed build does not burn a number.
      - name: Commit the bumped version back
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- app/build.gradle.kts; then
            echo "Version unchanged, nothing to commit."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "Release: sürüm numarası artırıldı"
          git push origin "HEAD:$BRANCH"
