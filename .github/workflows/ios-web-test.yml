name: iPhone web test

# Runs the web game in WebKit (the engine of Safari) on iPhone-sized screens, so iPhone-only problems show up here instead of on a
# friend's phone. Screenshots of every screen and device are attached to the run (artifact "ios-screenshots").
on:
  push:
    branches: [main]
    paths: ["cizim-hafiza/hosting/oyna/**", "cizim-hafiza/web-tests/**", ".github/workflows/ios-web-test.yml"]
  pull_request:
    paths: ["cizim-hafiza/hosting/oyna/**", "cizim-hafiza/web-tests/**", ".github/workflows/ios-web-test.yml"]
  workflow_dispatch:

jobs:
  ios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cizim-hafiza/web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps webkit chromium
      - name: "Test on iPhone sizes (WebKit) - screens, Safari vs Chrome, whole game flows"
        run: npm test
      # One page with every screen on every iPhone size, on a temporary preview address of the site (kept 7 days, replaced by the next run).
      # The address is written at the end of the run's summary.
      - name: Build the screenshot page
        if: always()
        run: node gallery.mjs
      - name: Publish the screenshot page (preview)
        if: always()
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          cd shots
          echo '{"hosting":{"public":".","ignore":["firebase.json"]}}' > firebase.json
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@13 hosting:channel:deploy ios-shots --expires 7d --project karalak-b6e11 --json > "$RUNNER_TEMP/deploy.json" || cat "$RUNNER_TEMP/deploy.json"
          URL=$(python3 -c "import json;d=json.load(open('$RUNNER_TEMP/deploy.json'));print(list(d['result'].values())[0]['url'])" 2>/dev/null)
          echo "iPhone screens: $URL"
          echo "### iPhone screenshots: $URL" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/sa.json" firebase.json
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: cizim-hafiza/web-tests/shots
