name: Emulator smoke test

# Builds the debug APK, boots a Google-APIs emulator (Play Services present), installs
# the app and walks the main screens taking screenshots — see .github/scripts/smoke.sh.
# It fails if the app crashes or hits an ANR, and reports cold-start times.
#
# The screenshots, start-up times and the app's log are force-pushed to the
# ci-smoke-results branch (one commit, overwritten every run) and attached as an
# artifact, so they can be looked at without downloading anything.
#
# Run it from the Actions tab (Run workflow), or it runs when this file or the script changes.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script to run in the emulator"
        type: choice
        default: smoke.sh
        options:
          - smoke.sh
          - tutorial.sh
          - worlds.sh
          - race.sh
          - offline.sh
          - createroom.sh
          - join.sh
          - lobby.sh
          - pages.sh
          - friends.sh
          - achievements.sh
  pull_request:
    paths:
      - ".github/workflows/smoke-test.yml"
      - ".github/scripts/smoke.sh"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: cizim-hafiza
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the smoke test in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/${{ inputs.script || 'smoke.sh' }}

      # Runs even when the test failed: a crash is exactly when the screenshots are wanted.
      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -d smoke-out || { echo "No results produced"; exit 0; }
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r smoke-out/. /tmp/pub/
          cd /tmp/pub
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Smoke test results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-smoke-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke-out/
          retention-days: 14
