<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karalak – Çiz, hatırla, yarış</title>
<meta name="description" content="Karalak: arkadaşlarınla çizim ve hafıza oyunu. Google Play'den indir ya da tarayıcıda hemen oyna.">
<meta name="theme-color" content="#7a3a10">
<meta property="og:title" content="Karalak – Çiz, hatırla, yarış">
<meta property="og:description" content="Arkadaşlarınla çizim ve hafıza oyunu. Hemen indir ya da tarayıcıda oyna!">
<meta property="og:image" content="https://karalak.com/oyna/icons/icon-512.png">
<meta property="og:url" content="https://karalak.com/indir">
<link rel="icon" href="/oyna/icons/icon-192.png">

<style>
  @font-face{font-family:Baloo;src:url(/oyna/fonts/baloo2_extrabold.woff2) format("woff2");font-weight:800;font-display:swap}
  @font-face{font-family:Baloo;src:url(/oyna/fonts/baloo2_bold.woff2) format("woff2");font-weight:600;font-display:swap}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{min-height:100vh;min-height:100dvh;font-family:Baloo,system-ui,sans-serif;color:#3b2314;background:#5a2a0c url(/oyna/img/bg_home_scene.webp) center/cover fixed;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(40,18,4,.35),rgba(40,18,4,.6));z-index:-1}
  .card{width:100%;max-width:420px;text-align:center;background:#fff6e2;border:4px solid #e0b878;border-radius:36px;padding:0 22px 26px;box-shadow:0 14px 40px rgba(0,0,0,.45);position:relative}
  .hero{width:190px;height:auto;margin-top:-62px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
  h1{margin:4px 0 2px;font-size:46px;line-height:1.05;font-weight:800;color:#f26a1b;-webkit-text-stroke:2px #8a3a00;paint-order:stroke fill;text-shadow:0 3px 0 #8a3a00}
  .tag{margin:0 0 16px;font-size:20px;font-weight:600;color:#7a5a40}
  .invite{display:none;margin:0 0 16px;padding:12px 14px;background:#fff;border:3px dashed #e9801d;border-radius:22px}
  .invite.on{display:block}
  .invite small{display:block;font-size:16px;font-weight:600;color:#7a5a40}
  .invite b{display:block;font-size:34px;letter-spacing:.14em;color:#f26a1b;font-weight:800;margin-top:2px}
  a.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;margin:10px 0 0;padding:8px 18px;border-radius:999px;font-family:inherit;font-size:22px;font-weight:800;text-decoration:none;transition:transform .12s}
  a.btn:active{transform:scale(.96)}
  a.primary{background:linear-gradient(#ff9a3c,#f26a1b);color:#fff;border:3px solid #c4500f;box-shadow:0 5px 0 #a8420c;text-shadow:0 2px 0 rgba(120,50,0,.6)}
  a.second{background:#fff;color:#c4500f;border:3px solid #e9801d;box-shadow:0 5px 0 #e0b878}
  a.btn svg{width:26px;height:26px;flex:none}
  .hidden{display:none!important}
  /* Turkish visitors get the painted page: the picture is the whole design, the links sit on its buttons */
  body.painted{display:block;padding:0;background:radial-gradient(circle at 50% 40%,#8a4a1a,#3a1a06);overflow:hidden}
  body.painted::before{display:none}
  body.painted .card{display:none}
  body.en .pg .stage{background-image:url(indir_en.webp)}
  .pg{display:none}
  body.painted .pg{display:block;position:fixed;inset:0}
  .pg .stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100dvh*841/1870));aspect-ratio:841/1870;background:url(indir_tr.webp) 0 0/100% 100%}
  .pg a{position:absolute;display:block;text-decoration:none;border-radius:999px;-webkit-tap-highlight-color:transparent;transition:transform .12s,filter .12s}
  .pg a:active{transform:scale(.97);filter:brightness(.92)}
  .pg .play{left:9.5%;top:56.1%;width:82%;height:8.6%}
  .pg .web{left:11.9%;top:66.1%;width:77.3%;height:7.1%}
  .pg .inv{display:none;left:14%;top:79.5%;width:72%;height:9.6%;background:#fff6e2;border:.5vmin solid #e0b878;color:#3b2314;text-align:center;font-family:Baloo,system-ui,sans-serif;box-shadow:0 .8vmin 0 #c9a46a;border-radius:4vmin}
  .pg .inv.on{display:block}
  .pg .inv small{display:block;font-size:min(3.3vw,1.5dvh);font-weight:600;color:#7a5a40;margin-top:1.4vmin}
  .pg .inv b{display:block;font-size:min(8vw,3.6dvh);letter-spacing:.14em;color:#f26a1b;font-weight:800;line-height:1.1}
  .pg .inv i{display:block;font-style:normal;font-size:min(3.3vw,1.5dvh);font-weight:800;color:#c4500f}
  .foot{margin:16px 0 0;font-size:15px;font-weight:600;color:#7a5a40}
  .foot a{color:#c4500f}
</style>
</head>
<body>
<div class="pg">
  <div class="stage">
    <a class="play" id="pg-play" href="#" aria-label="Google Play'den indir"></a>
    <a class="web" href="/" aria-label="Tarayıcıda hemen oyna"></a>
    <a class="inv" id="pg-inv" href="#"><small id="pg-invl"></small><b id="pg-code"></b><i id="pg-open">Karalak'ta aç</i></a>
  </div>
</div>
<main class="card">
  <img class="hero" src="/oyna/img/qm_mascot.webp" alt="" width="190" height="178">
  <h1>Karalak</h1>
  <p class="tag" id="tag">Çiz, hatırla, yarış!</p>
  <div class="invite" id="invite"><small id="invl"></small><b id="code"></b></div>
  <a class="btn primary hidden" id="open" href="#"><span id="open-t">Karalak'ta aç</span></a>
  <a class="btn primary" id="store" href="#"><svg viewBox="0 0 24 24"><path fill="#fff" d="M4 2.6v18.8c0 .5.5.8.9.6l16-9.4c.4-.2.4-.8 0-1L4.9 2c-.4-.2-.9.1-.9.6z"/></svg><span id="store-t">Google Play'den indir</span></a>
  <a class="btn second" id="web" href="/"><span id="web-t">Tarayıcıda hemen oyna</span></a>
  <p class="foot" id="foot"></p>
</main>
<script>
(function () {
  var pkg = "com.sualtikasifi.cizimhafiza", $ = function (i) { return document.getElementById(i); };
  var tr = /^tr/i.test(navigator.language || "tr");
  var L = tr
    ? { tag: "Çiz, hatırla, yarış!", room: "Odaya katılmak için oda kodu:", friend: "Arkadaş kodu:", title: "Karalak daveti", open: "Karalak'ta aç", store: "Google Play'den indir", web: "Tarayıcıda hemen oyna", foot: "Ücretsiz. Telefonda ve tarayıcıda." }
    : { tag: "Draw, remember, race!", room: "Room code to join:", friend: "Friend code:", title: "Karalak invite", open: "Open in Karalak", store: "Get it on Google Play", web: "Play in your browser", foot: "Free. On your phone and in your browser." };
  document.documentElement.lang = tr ? "tr" : "en";
  $("tag").textContent = L.tag; $("store-t").textContent = L.store; $("web-t").textContent = L.web; $("open-t").textContent = L.open; $("foot").textContent = L.foot;
  // clean links: /d/CODE (room), /f/CODE (friend); the old /davet/?t=&c= form still works
  var m = location.pathname.match(/^\/(d|f)\/([0-9A-Za-z]{1,16})/), q = new URLSearchParams(location.search);
  var type = m ? (m[1] === "f" ? "friend" : "join") : (q.get("t") === "friend" ? "friend" : "join");
  var code = (m ? m[2] : (q.get("c") || "")).replace(/[^0-9A-Za-z]/g, "").slice(0, 16);
  var ref = q.get("ref") || "";
  // the code rides along to the Play Store (Install Referrer), so a new player's invite can be recognised after the install
  var referrer = code ? "karalak_" + type + "=" + code : (ref ? "karalak_ref=" + ref.replace(/[^0-9A-Za-z]/g, "").slice(0, 16) : "");
  var store = "https://play.google.com/store/apps/details?id=" + pkg + (referrer ? "&referrer=" + encodeURIComponent(referrer) : "");
  $("store").href = store; $("pg-play").href = store;
  document.body.classList.add("painted"); if (!tr) document.body.classList.add("en");
  var android = /Android/i.test(navigator.userAgent), ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (code) { $("pg-inv").classList.add("on"); $("pg-invl").textContent = type === "friend" ? (tr ? "Arkadaş kodu" : "Friend code") : (tr ? "Oda kodu" : "Room code"); $("pg-open").textContent = L.open; $("pg-code").textContent = code; }
  if (code) { $("invite").classList.add("on"); $("invl").textContent = type === "friend" ? L.friend : L.room; $("code").textContent = code; document.title = L.title; }
  if (!(android && code)) $("pg-open").style.display = "none";
  if (android && code) {
    var intent = "intent://" + type + "/" + code + "#Intent;scheme=karalak;package=" + pkg + ";S.browser_fallback_url=" + encodeURIComponent(store) + ";end";
    $("open").href = intent; $("open").classList.remove("hidden"); $("pg-inv").href = intent;
    setTimeout(function () { location.href = intent; }, 300);
  }
  // an iPhone has no app: the browser game is the main button there
  if (ios) { $("store").className = "btn second"; $("web").className = "btn primary"; $("store").parentNode.insertBefore($("web"), $("store")); }
})();
</script>
</body>
</html>
