<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#7a3a10">
<title>Karalak - Oyna</title>
<!-- cache: html/js/css/json are served with no-cache (see firebase.json) -->
<link rel="stylesheet" href="style.css">
<link rel="preload" as="image" href="img/bg_home_scene.webp">
<link rel="preload" as="font" type="font/ttf" href="fonts/baloo2_extrabold.ttf" crossorigin>
</head>
<body>
<div id="stage">
  <section id="home" class="screen">
    <img class="bg" src="img/bg_home_scene.webp" alt="">
    <div id="h-gold" class="txt lt"></div><button id="h-runes" class="hit" aria-label="runes"></button>
    <div id="h-pen" class="txt lt"></div>
    <button id="h-avatar"></button>
    <div id="h-name" class="txt ink left"><span id="h-nick"></span><small id="h-lvl"></small></div>
    <div id="h-rank" class="txt"><span id="h-rank-t"></span></div>
    <div id="h-xpnext" class="txt ink right"></div>
    <div id="h-bar"><i id="h-fill"></i><span id="h-barlabel"></span></div>
    <div id="h-veil-gold" class="veil"></div><div id="h-veil-chest" class="veil"></div>
    <img id="h-dcard" src="img/home_daily_card.webp" alt=""><div id="h-dmul" class="txt dm"></div><div id="h-dpips"></div>
    <div id="ch-title" class="txt ink left"></div><div id="ch-tag" class="txt ink right"></div><button id="ch-info" class="hit" aria-label="info"></button><button id="ch-s0" class="ch-slot"></button><button id="ch-s1" class="ch-slot"></button><button id="ch-s2" class="ch-slot"></button><button id="ch-s3" class="ch-slot"></button><button id="h-dplay" class="dplay"></button><div id="h-dcount" class="txt lt"></div>
    <div id="h-ttl-gold" class="txt lt"></div><div id="h-ttl-daily" class="txt lt"></div><div id="h-ttl-chest" class="txt lt"></div><div id="h-soon-gold" class="txt cap2"></div><div id="h-soon-chest" class="txt cap2"></div>
    <button class="tile" id="tl-online"></button><button class="tile" id="tl-quick"></button><button class="tile" id="tl-offline"></button>
    <button class="tile" id="tl-levels"></button><button class="tile" id="tl-friends"></button><button class="tile" id="tl-ach"></button>
    <button class="tile" id="tl-league"></button><button class="tile" id="tl-store"></button><button class="tile" id="tl-settings"></button>
    <div class="txt lt tl" id="tx-online"></div><div class="txt lt tl" id="tx-quick"></div><div class="txt lt tl" id="tx-offline"></div>
    <div class="txt lt tl" id="tx-levels"></div><div class="txt lt tl" id="tx-friends"></div><div class="txt lt tl" id="tx-ach"></div>
    <div class="txt lt tl" id="tx-league"></div><div class="txt lt tl" id="tx-store"></div><div class="txt lt tl" id="tx-settings"></div>
  </section>

  <section id="store" class="screen">
    <img class="bg" data-src="img/st_bg.webp" alt="">
    <div id="st-t1" class="txt sign2"></div><div id="st-t2" class="txt sign2"></div>
    <button id="st-back" class="hit" aria-label="back"><img data-src="img/join_back.webp" alt=""></button>
    <div id="st-gold"><img data-src="img/icon_gold_coin.webp" alt=""><span id="st-goldn"></span></div>
    <div id="st-tabs"></div>
    <div id="st-shelf"></div>
    <div id="st-toast" class="hidden"></div>
  </section>

  <section id="settings" class="screen">
    <img class="bg" data-src="img/bg_settings.webp" alt="">
    <button id="se-back" class="hit" aria-label="back"></button>
    <div id="se-title" class="txt sign"></div>
    <div id="se-sound" class="txt sign3"></div>
    <div id="se-r0" class="se-row"></div><div id="se-r1" class="se-row"></div><div id="se-r2" class="se-row"></div><div id="se-r3" class="se-row"></div>
    <input id="se-code" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="se-use" class="pill orange small"><span id="se-use-t"></span></button>
    <div id="se-msg" class="txt cap3"></div>
    <button id="se-how" class="se-link"></button>
    <button id="se-lang" class="se-nav"></button><button id="se-tut" class="se-nav"></button><button id="se-bug" class="se-nav"></button><button id="se-acc" class="se-nav"></button><button id="se-rate" class="se-nav"></button>
    <a id="se-priv" class="se-priv" target="_blank" rel="noopener"><span id="se-priv-t"></span><small id="se-ver"></small></a>
  </section>

  <section id="ach" class="screen">
    <img class="bg" data-src="img/bg_achievements.webp" alt="">
    <div id="ac-list"></div>
    <img id="ac-sign" data-src="img/ach_sign.webp" alt="">
    <div id="ac-title" class="txt sign"></div>
    <button id="ac-back" class="hit" aria-label="back"><img data-src="img/join_back.webp" alt=""></button>
    <div id="ac-dlg" class="hidden"></div>
  </section>

  <section id="league" class="screen">
    <img class="bg" data-src="img/bg_league.webp" alt="">
    <div id="lg-list"></div>
    <img id="lg-sign" data-src="img/league_sign.webp" alt="">
    <div id="lg-title" class="txt sign"></div>
    <button id="lg-back" class="hit" aria-label="back"><img data-src="img/join_back.webp" alt=""></button>
    <button id="lg-refresh" class="hit" aria-label="refresh"><img data-src="img/league_wood.webp" alt=""><span>⟳</span></button>
    <div id="lg-tabs"></div>
    <div id="lg-timer" class="txt lg-timer"></div>
  </section>

  <section id="account" class="screen">
    <img class="bg" data-src="img/bg_account.webp" alt="">
    <button id="ak-back" class="hit" aria-label="back"><img data-src="img/join_back.webp" alt=""></button>
    <img id="ak-sign" data-src="img/ac_sign.webp" alt="">
    <div id="ak-title" class="txt sign"></div>
    <div id="ak-avatar"></div>
    <div id="ak-name" class="txt ink left"></div>
    <div id="ak-lvl" class="txt ink left sm"></div>
    <div id="ak-badge" class="txt left badge"></div>
    <div id="ak-bar"><i id="ak-fill"></i><span id="ak-barl"></span></div>
    <div class="ak-stat" id="ak-s0"><b></b><small></small></div><div class="ak-stat" id="ak-s1"><b></b><small></small></div><div class="ak-stat" id="ak-s2"><b></b><small></small></div>
    <div id="ak-sec" class="txt ink left"></div>
    <div id="ak-strip" class="txt ink left sm2"></div>
    <button id="ak-google" class="gbtn"></button>
    <button id="ak-out" class="pill orange"><span id="ak-out-t"></span></button>
    <button id="ak-del" class="delbtn"></button>
    <div id="ak-msg" class="txt capmsg"></div>
  </section>

  <section id="worlds" class="screen">
    <img class="bg" data-src="img/bg_worlds.webp" alt="">
    <div id="wl-list"></div>
    <button id="wl-back" class="hit" aria-label="back"><img data-src="img/join_back.webp" alt=""></button>
  </section>
  <section id="lvmap" class="screen">
    <img id="lm-bg" class="bg" data-src="img/bg_world_1.webp" alt="">
    <div id="lm-ring" class="hidden"></div>
    <div id="lm-nodes"></div>
    <button id="lm-back" class="hit" aria-label="back"><img data-src="img/join_back.webp" alt=""></button>
    <div id="lm-world"></div>
    <div id="lm-panel" class="hidden"></div>
  </section>

  <section id="friends" class="screen">
    <img class="bg" data-src="img/bg_friends.webp" alt="">
    <button id="fr-back" class="hit" aria-label="back"><img data-src="img/join_back.webp" alt=""></button>
    <button id="fr-duel" class="hit hidden-x" aria-label="duels"><img data-src="img/fr_clip.webp" alt=""></button>
    <img id="fr-sign" data-src="img/fr_sign.webp" alt=""><div id="fr-title" class="txt sign"></div>
    <img id="fr-panel" data-src="img/fr_panel_wide.webp" alt=""><div id="fr-codel" class="txt ink"></div><div id="fr-hint" class="txt cap4"></div>
    <img id="fr-frame" data-src="img/fr_code_frame.webp" alt="">
    <div id="fr-d0" class="txt ink dg"></div><div id="fr-d1" class="txt ink dg"></div><div id="fr-d2" class="txt ink dg"></div><div id="fr-d3" class="txt ink dg"></div><div id="fr-d4" class="txt ink dg"></div><div id="fr-d5" class="txt ink dg"></div>
    <button id="fr-share" class="frbtn w"><span id="fr-sharet"></span></button>
    <img id="fr-ribbon1" data-src="img/fr_ribbon.webp" alt=""><div id="fr-ribbon1t" class="txt sign4"></div>
    <input id="fr-input" inputmode="numeric" maxlength="6" autocomplete="off">
    <button id="fr-add" class="frbtn s"><span id="fr-addt"></span></button>
    <div id="fr-msg" class="txt sign4 m"></div>
    <img id="fr-ribbon2" data-src="img/fr_ribbon.webp" alt=""><div id="fr-ribbon2t" class="txt sign4"></div>
    <img id="fr-bigpanel" data-src="img/fr_panel_big.webp" alt="">
    <div id="fr-list"></div>
    <div id="fr-menu" class="hidden"></div>
  </section>

  <section id="onl" class="screen">
    <img class="bg" data-src="img/bg_race2.webp" alt="">
    <button id="on-back" class="hit" aria-label="back"><img data-src="img/join_back.webp" alt=""></button>
    <img id="on-sign" data-src="img/race2_sign.webp" alt=""><div id="on-title" class="txt sign"></div>
    <img id="on-paper" data-src="img/race2_paper.webp" alt=""><div id="on-text" class="txt ink col"></div>
    <button id="on-create" class="imgbtn o"><span id="on-create-t"></span></button>
    <button id="on-join" class="imgbtn b"><span id="on-join-t"></span></button>
  </section>
  <section id="onj" class="screen">
    <img class="bg" data-src="img/bg_join.webp" alt="">
    <button id="oj-back" class="hit" aria-label="back"><img data-src="img/join_back.webp" alt=""></button>
    <div id="oj-title" class="txt sign"></div>
    <img id="oj-panel" data-src="img/join_panel.webp" alt="">
    <input id="oj-nick" class="inp" maxlength="20" autocomplete="off"><input id="oj-code" class="inp" inputmode="numeric" maxlength="6" autocomplete="off">
    <div id="oj-msg" class="txt capw"></div>
    <button id="oj-go" class="imgbtn j"><span id="oj-go-t"></span></button>
  </section>
  <section id="onc" class="screen">
    <img class="bg" data-src="img/bg_offline.webp" alt="">
    <button id="oc-back" class="hit" aria-label="back"><img data-src="img/join_back.webp" alt=""></button>
    <div id="oc-title" class="txt sign"></div>
    <img id="oc-paper" data-src="img/offline_paper.webp" alt=""><div id="oc-body"></div>
    <button id="oc-make" class="imgbtn s"><span id="oc-make-t"></span></button>
    <div id="oc-msg" class="txt capw"></div>
  </section>
  <section id="onw" class="screen">
    <img class="bg" data-src="img/bg_lobby.webp" alt="">
    <button id="ow-back" class="hit" aria-label="back"><img data-src="img/join_back.webp" alt=""></button>
    <div id="ow-title" class="txt sign"></div>
    <img id="ow-codep" data-src="img/lobby_codepanel.webp" alt=""><div id="ow-codeh" class="txt ink sm"></div><div id="ow-code" class="txt ink codebig"></div>
    <div id="ow-occ" class="txt capw"></div>
    <div id="ow-list"></div>
    <div id="ow-info" class="txt capw"></div>
    <button id="ow-ready" class="imgbtn g"><span id="ow-ready-t"></span></button>
    <button id="ow-start" class="imgbtn o"><span id="ow-start-t"></span></button>
    <button id="ow-invite" class="imgbtn b"><span id="ow-invite-t"></span></button>
    <div id="ow-cd" class="hidden"></div>
    <div id="ow-sheet" class="hidden"></div>
  </section>

  <section id="found" class="screen scrollx">
    <img class="bg" data-src="img/mf_bg.webp" alt="">
    <img id="f-title" data-src="img/mf_title.webp" alt=""><img id="f-tag" data-src="img/mf_tag.webp" alt=""><div id="f-tagt" class="txt ink"></div>
    <div id="f-cl" class="mcard"><img data-src="img/mf_card_r.webp" alt=""><div class="mc-av"></div><div class="mc-rb"><img data-src="img/mf_ribbon_r.webp" alt=""><span></span></div><div class="mc-xp"><img data-src="img/mf_star.webp" alt=""><b></b></div></div>
    <div id="f-cr" class="mcard"><img data-src="img/mf_card_b.webp" alt=""><div class="mc-av"></div><div class="mc-rb"><img data-src="img/mf_ribbon_b.webp" alt=""><span></span></div><div class="mc-xp"><img data-src="img/mf_star.webp" alt=""><b></b></div></div>
    <img id="f-vs" data-src="img/mf_vs.webp" alt=""><img id="f-mas" data-src="img/mf_mascots.webp" alt="">
    <div id="f-plank"><img data-src="img/mf_plank.webp" alt=""><div id="f-pt" class="txt lt"></div><div id="f-bar"><i id="f-fill"></i></div></div>
    <div id="f-t1" class="tip"><img data-src="img/mf_tip1.webp" alt=""><span></span></div><div id="f-t2" class="tip"><img data-src="img/mf_tip2.webp" alt=""><span></span></div><div id="f-t3" class="tip"><img data-src="img/mf_tip3.webp" alt=""><span></span></div>
  </section>

  <section id="report" class="screen">
    <img class="bg" data-src="img/bg_report.webp" alt="">
    <button id="rp-back" class="hit" aria-label="back"><img data-src="img/join_back.webp" alt=""></button>
    <img id="rp-sign" data-src="img/rp_sign.webp" alt=""><div id="rp-title" class="txt sign"></div>
    <div id="rp-body"></div>
  </section>

  <section id="runes" class="screen">
    <img class="bg" data-src="img/rune_screen_bg.webp" alt="">
    <button id="ru-back" class="hit" aria-label="back"><img data-src="img/join_back.webp" alt=""></button>
    <div id="ru-title" class="txt sign"></div>
    <div id="ru-gold"><img data-src="img/icon_gold_coin.webp" alt=""><span id="ru-goldn"></span></div>
    <div id="ru-map"></div>
    <div id="ru-detail"></div>
  </section>

  <section id="welcome" class="screen">
    <img class="bg" data-src="img/bg_tutorial_welcome.webp" alt="">
    <div id="w-title" class="txt ink"></div><div id="w-body" class="txt ink body"></div>
    <button id="w-go" class="pill orange"><span id="w-go-t"></span></button>
    <button id="w-skip" class="wskip"></button>
  </section>

  <section id="draw" class="screen">
    <img class="bg" data-src="img/bg_draw.webp" alt="">
    <button id="d-back" class="hit" aria-label="back"></button>
    <div id="d-prog" class="txt ink"></div>
    <div id="d-ring" class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="trk"/><circle id="d-arc" cx="50" cy="50" r="44" class="arc"/></svg><span id="d-time"></span></div>
    <div id="d-word" class="txt ink"></div>
    <div id="d-line"></div>
    <div id="d-canvas" class="paper"><canvas id="pad"></canvas><button id="d-timej" class="timej"><img data-src="img/joker_extra_time.webp" alt=""><span id="d-timej-t"></span><i id="d-timej-n"></i></button></div>
    <button id="d-music" class="hit mus" aria-label="music"></button>
    <button id="t-pen" class="tool on" aria-label="pen"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
    <button id="t-erase" class="tool" aria-label="eraser"><svg viewBox="0 0 24 24"><path d="M16.24 3.56l4.95 4.94a1.5 1.5 0 0 1 0 2.12L12.8 19H20v2H8.5l-4.7-4.7a1.5 1.5 0 0 1 0-2.12l10.3-10.3a1.5 1.5 0 0 1 2.14-.32zM6 17.4l2.1 2.1 2.9-2.9-4.2-4.2L4.9 14.3 6 17.4z"/></svg></button>
    <button id="t-undo" class="tool" aria-label="undo"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62A7.96 7.96 0 0 1 12.5 10c3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 10.79 17.15 8 12.5 8z"/></svg></button>
    <button id="t-clear" class="tool" aria-label="clear"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
    <button id="d-next" class="pill orange small"><span id="d-next-t"></span></button>
  </section>

  <section id="guess" class="screen">
    <div id="g-bgtop" class="slice"></div><div id="g-bgmid" class="slice"></div><div id="g-bgbot" class="slice"></div>
    <button id="g-back" class="hit" aria-label="back"></button>
    <div id="g-prog" class="txt ink"></div>
    <div id="g-xp" class="txt xp"></div>
    <div id="g-ring" class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="trk"/><circle id="g-arc" cx="50" cy="50" r="44" class="arc"/></svg><span id="g-time"></span></div>
    <div id="g-canvas" class="paper"><canvas id="view"></canvas><div id="g-blanks"></div><div id="g-flash"></div></div>
    <button id="g-music" class="hit mus" aria-label="music"></button>
    <button class="jt" id="jt-ad"><svg viewBox="0 0 24 24" style="fill:#f26a1b"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 14.5v-9l7 4.5-7 4.5z"/></svg><span></span></button>
    <button class="jt" id="jt-first"><img data-src="img/joker_first_letter.webp" alt=""><span></span><i></i></button>
    <button class="jt" id="jt-count"><img data-src="img/joker_letter_count.webp" alt=""><span></span><i></i></button>
    <button class="jt" id="jt-skip"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg><span></span></button>
    <form id="g-form"><input id="g-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"><button id="g-ok" class="pill orange small"><span id="g-ok-t"></span></button></form>
  </section>

  <section id="search" class="screen">
    <img class="bg" data-src="img/bg_qm_search.webp" alt="">
    <img id="s-sign" data-src="img/qm_sign.webp" alt="">
    <div id="s-text" class="txt sign"></div>
    <div id="s-paper"><svg viewBox="0 0 100 100"><path id="s-doodle" pathLength="100" d=""/></svg></div>
    <div id="s-sub" class="txt cap"></div>
  </section>

  <section id="result" class="screen scroll">
    <div class="wood"></div>
    <div id="r-col">
      <div id="r-head"><img data-src="img/rs_head.webp" alt=""><button id="r-back" aria-label="back"></button><div id="r-title" class="txt sign"></div></div>
      <div id="r-vs"></div>
      <div id="r-list"></div>
      <button id="again" class="pill orange"><span id="again-t"></span></button>
    </div>
  </section>

  <div id="pick" class="hidden"></div>
  <div id="dialog" class="hidden"><div class="box"><div id="dlg-text"></div><div id="dlg-extra"></div><div class="row"><button id="dlg-no" class="pill cream small"></button><button id="dlg-yes" class="pill orange small"></button></div></div></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
