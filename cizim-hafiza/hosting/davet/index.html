<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karalak daveti</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#FBF3E3; color:#2A2118; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; text-align:center; padding:24px; box-sizing:border-box; }
  .card { max-width:360px; }
  h1 { font-size:1.8rem; margin:0 0 8px; }
  p { color:#6B5B2A; margin:0 0 18px; }
  .code { font-size:2rem; letter-spacing:.15em; font-weight:800; color:#F97316; margin-bottom:18px; }
  a.btn { display:block; padding:14px 18px; border-radius:999px; font-weight:700; text-decoration:none; margin:10px 0; }
  a.primary { background:#F97316; color:#fff; }
  a.secondary { background:#fff; color:#F97316; border:2px solid #F97316; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Karalak'a davetlisin!</h1>
  <p id="sub">Çiz, hatırla, yarış.</p>
  <div class="code" id="code"></div>
  <a class="btn primary" id="open" href="#">Karalak'ta aç</a>
  <a class="btn secondary" id="store" href="#">Play Store'dan indir</a>
</div>
<script>
(function () {
  var pkg = "com.sualtikasifi.cizimhafiza";
  var store = "https://play.google.com/store/apps/details?id=" + pkg;
  var q = new URLSearchParams(location.search);
  var type = q.get("t") === "friend" ? "friend" : "join";
  var code = (q.get("c") || "").replace(/[^0-9A-Za-z]/g, "").slice(0, 16);
  if (type === "friend") {
    document.getElementById("title").textContent = "Arkadaş daveti";
    document.getElementById("sub").textContent = "Karalak'ta arkadaş ol. Arkadaş kodu:";
  } else {
    document.getElementById("sub").textContent = "Odaya katılmak için oda kodu:";
  }
  document.getElementById("code").textContent = code;
  document.getElementById("store").href = store;
  // Opens the app when it is installed; otherwise Chrome falls back to the Play Store page.
  var intent = "intent://" + type + "/" + code + "#Intent;scheme=karalak;package=" + pkg +
    ";S.browser_fallback_url=" + encodeURIComponent(store) + ";end";
  var open = document.getElementById("open");
  open.href = intent;
  if (/Android/i.test(navigator.userAgent) && code) {
    setTimeout(function () { location.href = intent; }, 300);
  }
})();
</script>
</body>
</html>
